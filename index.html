<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LLM Academy">
<meta name="theme-color" content="#FAF9F6">
<meta name="description" content="A daily course on the theory and practice of large language models.">
<link rel="manifest" href="manifest.json?v=31">
<link rel="apple-touch-icon" href="icon-180.png?v=31">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=31">
<title>LLM Academy</title>
<style>:root{padding-top:env(safe-area-inset-top,0px)}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,400&display=swap">
<style>
/* Polaris v7.0 tokens, Brilliant-style proportions. One 600px column on Paper; large type, roomy White cards,
   lesson path, select-then-check answers, slide-up feedback sheet. No orange anywhere (owner preference). */
:root{
  --marine:#15314F; --marine-80:#3A5273; --marine-60:#647890; --marine-40:#95A4B5; --marine-20:#C5CDD7; --marine-10:#E2E6EB;
  --paper:#FAF9F6; --white:#FFFFFF; --mist:#F4F6F9; --border:#DCE0E6; --border-l:#ECEFF3;
  --cobalt-dk:#1E3E8F; --cobalt:#2B59C3; --cobalt-l:#7FA0E8; --cobalt-20:#C9D6F2; --cobalt-10:#E1E9F9; --cobalt-5:#F0F4FC;
  --sand:#E1A87C; --sand-20:#F6DCC3; --sand-10:#FBEEE2; --sand-5:#FEF7F2;
  --slate:#6B7280; --slate-l:#9CA3AF;
  --disp:'Avenir Next','Avenir','Nunito Sans','Helvetica Neue',Arial,sans-serif;
  --sans:'Avenir Next','Avenir','Nunito Sans','Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,Menlo,Courier,monospace;
  --ease:cubic-bezier(0.22,0.61,0.36,1);
  /* aliases used by widgets */
  --bg:var(--paper); --bg2:var(--mist); --card:var(--white); --card2:var(--mist); --line:var(--border);
  --tx:var(--marine); --tx2:var(--marine-60); --tx3:var(--marine-40);
  --acc:var(--cobalt); --acc2:var(--cobalt-l); --good:var(--marine); --bad:var(--slate); --warn:var(--cobalt-l); --gold:var(--sand);
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--marine-60);font-family:var(--sans);font-size:17px;line-height:1.6}
#app{max-width:600px;margin:0 auto;position:relative}
.view{padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 104px)}
.view.player{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 140px)}
h1{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1.2;letter-spacing:-0.01em;color:var(--marine);text-wrap:balance}
h2{font-family:var(--disp);font-weight:700;font-size:23px;letter-spacing:-0.005em;line-height:1.3;color:var(--marine);margin-bottom:12px;text-wrap:balance}
h3{font-family:var(--sans);font-weight:600;font-size:18px;line-height:1.35;color:var(--marine)}
p{margin-bottom:14px}
b,strong{font-weight:600;color:var(--marine)}
.sub{color:var(--marine-60);font-size:15px;line-height:1.5}
.tiny{color:var(--marine-40);font-size:13px;line-height:1.45}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--marine-40);margin-bottom:6px}
.eyebrow.cob{color:var(--cobalt)}
.ic{display:block;flex:none}
.row{display:flex;align-items:center;gap:14px}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--white);border:1px solid var(--border-l);border-radius:16px;padding:20px;min-width:0}
.tap{cursor:pointer;transition:border-color 150ms var(--ease),background-color 150ms var(--ease)}
.tap:hover{border-color:var(--marine-20)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:32px 0 14px}
.section-h h2{margin:0}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:14px 20px;border:none;border-radius:12px;
  background:var(--marine);color:var(--white);font-family:var(--sans);font-size:17px;font-weight:600;cursor:pointer;transition:background-color 150ms var(--ease)}
.btn:hover{background:var(--marine-80)}
.btn.cob{background:var(--cobalt)} .btn.cob:hover{background:var(--cobalt-dk)}
.btn.ghost{background:var(--white);color:var(--marine);border:1.5px solid var(--border)} .btn.ghost:hover{background:var(--mist)}
.btn.sm{width:auto;min-height:44px;padding:10px 18px;font-size:15px}
.btn:disabled{background:var(--marine-10);color:var(--marine-40);cursor:default}
.btn:focus-visible,.opt:focus-visible,.iconbtn:focus-visible,#nav button:focus-visible,.tap:focus-visible{outline:3px solid var(--cobalt-20);outline-offset:2px}
.iconbtn{width:44px;height:44px;border-radius:12px;background:transparent;border:none;color:var(--marine-60);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--mist)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:100px;background:var(--white);border:1px solid var(--border-l);
  font-weight:600;font-size:15px;color:var(--marine);font-variant-numeric:tabular-nums}
.chip.cob{color:var(--cobalt)}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:100px;font-size:12px;font-weight:600;background:var(--cobalt-10);color:var(--cobalt-dk)}
.pill.mist{background:var(--mist);color:var(--marine-60)}

/* progress */
.bar{height:8px;background:var(--marine-10);border-radius:100px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--cobalt);border-radius:100px;transition:width .4s var(--ease)}
.segs{display:flex;gap:4px;flex:1}
.segs i{flex:1;height:6px;border-radius:100px;background:var(--marine-10)}
.segs i.on{background:var(--cobalt)}

/* home */
.apphead{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.apphead .t{font-family:var(--disp);font-weight:700;font-size:22px;color:var(--marine);line-height:1.1}
.week{display:flex;justify-content:space-between;margin-top:14px}
.week .d{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--marine-40)}
.week .dot{width:34px;height:34px;border-radius:100px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--white)}
.week .d.on .dot{background:var(--cobalt);border-color:var(--cobalt)}
.week .d.today .dot{border-color:var(--cobalt);border-width:2px}
.week .d.today{color:var(--cobalt)}
.hero{background:var(--white);border:1px solid var(--border-l);border-radius:20px;padding:24px;margin:14px 0}
.hero h2{font-size:28px;margin:4px 0 8px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}
.step{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:100px;background:var(--mist);font-size:14px;font-weight:500;color:var(--marine-60)}
.step .n{font-family:var(--disp);color:var(--marine)}
.step.done{background:var(--cobalt-10);color:var(--cobalt-dk)}
.tile{width:56px;height:56px;border-radius:14px;background:var(--cobalt-10);display:flex;align-items:center;justify-content:center;flex:none}
.tile span{font-family:var(--disp);font-size:22px;color:var(--cobalt-dk);font-variant-numeric:tabular-nums}
.tile.p{background:var(--sand-10)} .tile.p span{color:var(--marine)}
.course{display:flex;gap:16px;align-items:flex-start}
.course h3{margin-bottom:2px}
.course .meta{display:flex;align-items:center;gap:10px;margin-top:12px}
.course .meta .bar{flex:1}
.course .meta span{font-size:13px;font-weight:600;color:var(--marine-60);font-variant-numeric:tabular-nums;flex:none}

/* module path */
.mhead{margin:6px 0 26px}
.mhead h1{margin:4px 0 8px}
.path{position:relative;padding-left:4px}
.node{display:flex;align-items:center;gap:16px;position:relative;padding:10px 0}
.node:not(:last-child)::after{content:"";position:absolute;left:31px;top:72px;bottom:-12px;width:2px;background:var(--border)}
.node.done:not(:last-child)::after{background:var(--marine)}
.node .c{width:56px;height:56px;border-radius:100px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;
  background:var(--white);border:2px solid var(--border);font-family:var(--disp);font-size:22px;color:var(--marine-40)}
.node.done .c{background:var(--marine);border-color:var(--marine);color:var(--white)}
.node.next .c{background:var(--cobalt);border-color:var(--cobalt);color:var(--white);width:64px;height:64px;margin-left:-4px;margin-right:-4px}
.node .body{flex:1;min-width:0;padding:14px 16px;border-radius:14px;border:1px solid transparent}
.node.next .body{background:var(--white);border-color:var(--cobalt-20)}
.node .body h3{font-size:17px}
.node.tap:hover .body{background:var(--white);border-color:var(--border-l)}

/* lesson player */
.ptop{display:flex;align-items:center;gap:10px;margin:-6px -6px 22px}
.ptop .count{font-size:13px;font-weight:600;color:var(--marine-40);flex:none;min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.screen{min-width:0;font-size:18px;line-height:1.65}
.screen h2{font-size:26px;margin-bottom:16px}
.screen p{margin-bottom:16px}
.screen ul,.screen ol{margin:0 0 16px 22px}
.screen li{margin-bottom:8px}
.screen code,.qtext code{background:var(--mist);border:1px solid var(--border-l);border-radius:6px;padding:1px 6px;font-family:var(--mono);font-size:.85em;color:var(--marine)}
.formula{background:var(--white);border:1px solid var(--border-l);border-radius:14px;padding:18px;text-align:center;
  font-family:var(--disp);font-style:italic;font-size:20px;margin:4px 0 18px;overflow-x:auto;color:var(--marine)}
.formula .rm{font-style:normal}
.note{background:var(--cobalt-5);border:1px solid var(--cobalt-10);border-radius:14px;padding:16px 18px;margin-bottom:16px;font-size:16px;line-height:1.6}
.note.gold{background:var(--sand-5);border-color:var(--sand-10)}
.ex{background:var(--white);border:1px solid var(--border-l);border-radius:14px;padding:16px 18px;margin-bottom:16px;font-size:16px;line-height:1.6}
.qtext{font-size:21px;font-weight:600;line-height:1.4;color:var(--marine);margin-bottom:22px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:64px;padding:14px 16px;border-radius:14px;
  background:var(--white);border:2px solid var(--border-l);color:var(--marine);font-family:var(--sans);font-size:16px;line-height:1.45;cursor:pointer;
  transition:border-color 150ms var(--ease),background-color 150ms var(--ease)}
.opt:hover{border-color:var(--marine-20)}
.opt .k{width:32px;height:32px;border-radius:100px;background:var(--mist);flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:var(--marine-60)}
.opt.sel{border-color:var(--cobalt);background:var(--cobalt-5)} .opt.sel .k{background:var(--cobalt);color:var(--white)}
.opt.right{border-color:var(--cobalt);background:var(--cobalt-5)} .opt.right .k{background:var(--cobalt);color:var(--white)}
.opt.wrong{border-color:var(--sand);background:var(--sand-5)} .opt.wrong .k{background:var(--sand);color:var(--white)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--paper);border-top:1px solid var(--border-l);
  padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 14px)}
.actionbar .in{max-width:560px;margin:0 auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;border-radius:24px 24px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 16px);
  transform:translateY(105%);transition:transform 260ms var(--ease)}
.sheet.show{transform:none}
.sheet .in{max-width:560px;margin:0 auto}
.sheet.ok{background:var(--cobalt-10)}
.sheet.no{background:var(--sand-10)}
.sheet .sh{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;color:var(--marine);margin-bottom:8px}
.sheet.ok .sh{color:var(--cobalt-dk)}
.sheet .sx{font-size:15.5px;line-height:1.55;color:var(--marine-80);margin-bottom:16px;max-height:34vh;overflow-y:auto}

/* widgets */
.widget{background:var(--white);border:1px solid var(--border-l);border-radius:16px;padding:18px;margin-bottom:16px;min-width:0;font-size:16px}
.widget h3{margin-bottom:12px;font-size:12px;font-weight:600;color:var(--marine-40);text-transform:uppercase;letter-spacing:2px}
.widget input[type=text]{width:100%;background:var(--white);border:1.5px solid var(--border);border-radius:10px;color:var(--marine);padding:12px 14px;font-size:16px;font-family:var(--sans);outline:none}
.widget input[type=text]:focus{border-color:var(--cobalt)}
.widget input[type=range]{width:100%;accent-color:var(--cobalt);height:32px}
.widget .btn.small,.widget .btn.ghost.small{width:auto;min-height:42px;padding:8px 18px;font-size:15px;display:inline-flex}
.wlabel{display:flex;justify-content:space-between;font-size:14px;color:var(--marine-60);margin:10px 0 2px}
.wlabel b{color:var(--marine);font-variant-numeric:tabular-nums}
.tok{display:inline-block;margin:4px 4px 0 0;padding:4px 9px;border-radius:6px;border:1px solid var(--border-l);font-family:var(--mono);font-size:14px;color:var(--marine)}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.bars .brow{display:flex;align-items:center;gap:8px;font-size:14px}
.bars .blab{width:78px;font-family:var(--mono);color:var(--marine-60);text-align:right;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .btrack{flex:1;height:18px;background:var(--mist);overflow:hidden;min-width:0}
.bars .bfill{height:100%;background:var(--cobalt);transition:width .2s var(--ease);min-width:2px}
.bars .bval{width:52px;font-size:13px;color:var(--marine-60);flex:none;font-variant-numeric:tabular-nums}
.heat{display:grid;gap:2px;margin-top:8px}
.heat .hcell{aspect-ratio:1;cursor:pointer;max-width:100%}
.heat .hlab{font-size:10px;color:var(--marine-40);display:flex;align-items:center;justify-content:center;font-family:var(--mono);overflow:hidden}
.canvasbox{background:var(--white);border:1px solid var(--border-l);border-radius:10px;width:100%;margin-bottom:10px}
.divider{height:1px;background:var(--border-l);margin:16px 0}
.row .btn.small{width:auto}

/* results and stats */
.result{text-align:center;padding-top:6vh}
.result .mark{width:72px;height:72px;border-radius:100px;background:var(--cobalt-10);color:var(--cobalt);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.result h1{margin:4px 0 6px}
.bignum{font-family:var(--disp);font-size:64px;line-height:1.05;color:var(--cobalt);margin:14px 0 4px;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 26px;text-align:center}
.tiles .t{background:var(--white);border:1px solid var(--border-l);border-radius:14px;padding:14px 8px}
.tiles .v{font-family:var(--disp);font-size:24px;color:var(--marine);font-variant-numeric:tabular-nums;line-height:1.2}
.tiles .l{font-size:12px;font-weight:600;color:var(--marine-40);margin-top:4px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--white);border:1px solid var(--border-l);border-radius:16px;padding:18px}
.stat .v{font-family:var(--disp);font-size:30px;line-height:1.1;color:var(--marine);font-variant-numeric:tabular-nums}
.stat .v.cob{color:var(--cobalt)}
.stat .l{font-size:13px;color:var(--marine-40);font-weight:600;margin-top:6px}
.wkbar{display:flex;gap:5px;align-items:flex-end;height:64px;margin-top:14px;border-bottom:1px solid var(--marine-20)}
.wkbar .wb{flex:1;background:var(--cobalt);min-height:3px}
.wkbar .wb.off{background:var(--mist)}
.lrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border-l)}
.lrow:last-child{border-bottom:none}
.mnum{font-family:var(--disp);font-size:15px;color:var(--marine-40);flex:none;min-width:30px;font-variant-numeric:tabular-nums}
.stagec{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border-l)}
.stagec:last-child{border-bottom:none}
.stagec .sn{width:40px;height:40px;border-radius:100px;background:var(--cobalt-10);color:var(--cobalt-dk);font-family:var(--disp);font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
.stagec.skip .sn{background:var(--mist);color:var(--marine-40)}
textarea{font-family:var(--mono)}


/* library */
.tabs{display:flex;background:var(--mist);border:1px solid var(--border-l);border-radius:12px;padding:4px;margin-bottom:20px}
.tabs button{flex:1;min-height:42px;border:none;background:none;border-radius:9px;font-family:var(--sans);font-size:15px;font-weight:600;color:var(--marine-60);cursor:pointer}
.tabs button.on{background:var(--white);color:var(--marine);box-shadow:0 1px 3px rgba(21,49,79,.12)}
.fld{width:100%;background:var(--white);border:1.5px solid var(--border);border-radius:12px;color:var(--marine);padding:13px 14px;font-size:16px;font-family:var(--sans);outline:none;resize:vertical}
.fld:focus{border-color:var(--cobalt)}
textarea.fld{min-height:70px;line-height:1.45}
.libitem{display:flex;gap:14px;align-items:flex-start}
.libicon{width:44px;height:44px;border-radius:12px;background:var(--cobalt-5);color:var(--cobalt);display:flex;align-items:center;justify-content:center;flex:none}
.libicon.file{background:var(--sand-10);color:var(--marine)}
.libicon.topic{background:var(--marine-10);color:var(--marine)}
.libitem h3{margin-bottom:2px;word-break:break-word}
.libitem .nt{font-size:15px;color:var(--marine-80);margin:8px 0 0;line-height:1.5}
.libact{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.libact a.btn{text-decoration:none}
.libact .btn.sm{min-height:40px;padding:8px 14px;font-size:14px}
.btn.cob5{background:var(--cobalt-5);color:var(--cobalt-dk);border:1px solid var(--cobalt-10)} .btn.cob5:hover{background:var(--cobalt-10)}
.ready{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--cobalt);margin-top:8px}
.tri{display:flex;gap:4px;background:var(--mist);border-radius:10px;padding:3px;flex:none}
.tri button{border:none;background:none;border-radius:8px;padding:7px 9px;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--marine-60);cursor:pointer}
.tri button.on{background:var(--white);color:var(--marine);box-shadow:0 1px 2px rgba(21,49,79,.14)}
.tri button.on.more{background:var(--cobalt);color:#fff}
.tri button.on.skip{background:var(--marine-20);color:var(--marine)}
details.cur{background:var(--white);border:1px solid var(--border-l);border-radius:16px;margin-bottom:12px;overflow:hidden}
details.cur summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:14px}
details.cur summary::-webkit-details-marker{display:none}
details.cur .inner{padding:0 18px 16px}
.lrow2{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--border-l)}
.lrow2 .grow{font-size:15px;color:var(--marine);line-height:1.35}
.tagchip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:100px;background:var(--cobalt-5);border:1px solid var(--cobalt-10);color:var(--cobalt-dk);font-size:14px;font-weight:600;margin:0 8px 8px 0}
.tagchip button{border:none;background:none;color:var(--marine-40);cursor:pointer;padding:0;display:flex}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--cobalt-20);border-top-color:var(--cobalt);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* nav */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--white);border-top:1px solid var(--border-l)}

<script>
"use strict";
const MODULES = [];
/* ============ FOUNDATIONS 0. THE GROUND FLOOR (CS BASICS) ============ */
MODULES.push({
id:'c0', track:'F', title:'The Ground Floor', tag:'Bits, compute, probability, and information, the CS under the AI', icon:'\u{1F9F0}', color:'#20b8cd',
lessons:[

{id:'c0a', title:'Bits, bytes, and numbers', screens:[
{t:'txt', h:'<h2>Start with a light switch</h2><p>A <b>bit</b> is the smallest possible piece of information: one of two states, 0 or 1. Everything a computer holds, this sentence, a photo, a trillion-parameter model, is bits and nothing else.</p><div class="ex"><b>Worked example.</b> One bit distinguishes 2 possibilities. Two bits distinguish 4 (00, 01, 10, 11). Ten bits distinguish 2<sup>10</sup> = 1,024. Every added bit doubles the options. This doubling is the single most useful instinct in computing: 20 bits is a million options, 30 bits is a billion.</div><p>A <b>byte</b> is 8 bits, so it holds one of 256 values. Text is bytes via an agreed code: in UTF-8, <code>A</code> is the byte 65, and the euro sign takes three bytes. This is where Module 1&rsquo;s byte-level tokenizers bottom out: any text, in any language, is ultimately a byte sequence.</p>'},
{t:'w', widget:'bin', h:'<h2>Read a byte</h2><p>Slide the value and watch its 8 bits flip. Each position is worth double the one to its right: 128, 64, 32, 16, 8, 4, 2, 1.</p>'},
{t:'q', q:'A model has a vocabulary of about 128,000 tokens. Roughly how many bits identify one token?', opts:['8 bits','17 bits','128 bits','128,000 bits'], a:1, ex:'2¹⁷ = 131,072, just over 128,000. Seventeen yes/no distinctions pick one token out of the whole vocabulary. Doubling-counting like this is the core skill of this lesson.'},
{t:'txt', h:'<h2>Numbers with decimal points</h2><p>Weights are not whole numbers; they are values like 0.0273. Computers store these in <b>floating point</b>: a sign, an exponent (the scale), and a fraction (the precision), binary scientific notation.</p><ul><li><b>FP32</b> (32 bits per number) was the old standard for training.</li><li><b>FP16 / BF16</b> (16 bits) is standard for modern training: half the memory, double the speed, precision still sufficient.</li><li><b>8-bit and 4-bit integers</b> are used to serve models cheaply. Fewer bits per weight means less memory and bandwidth, at a small cost in fidelity.</li></ul><div class="note"><b>Connection.</b> This is exactly the quantization you met in Module 6. &ldquo;4-bit quantized&rdquo; literally means each learned number is stored in 4 bits, 16 possible levels, instead of 16 or 32 bits. An 8B-parameter model at 4 bits fits in about 4 GB of memory: 8 billion × half a byte.</div>'},
{t:'q', q:'A 70B-parameter model stored in FP16 needs roughly how much memory for weights alone?', opts:['about 14 GB','about 70 GB','about 140 GB','about 280 GB'], a:2, ex:'FP16 is 2 bytes per parameter: 70 billion × 2 bytes = 140 GB. This one multiplication tells you what hardware any model needs, and why quantization matters commercially.'},
]},

{id:'c0b', title:'How machines compute', screens:[
{t:'txt', h:'<h2>Dumb steps, astonishing speed</h2><p>A processor executes tiny instructions: load a number, add two numbers, store the result, compare and jump. Nothing clever ever happens in one step. The power comes from rate: billions of instructions per second, per core.</p><div class="ex"><b>Worked example.</b> Multiplying two 1,000&times;1,000 matrices takes about 2 billion arithmetic operations. A single CPU core at a few billion operations per second grinds through it in roughly a second. A modern GPU does the same job in about a millisecond, because it is built to do thousands of multiplications <i>simultaneously</i>.</div><p>That word, simultaneously, is the whole story of AI hardware.</p>'},
{t:'txt', h:'<h2>CPU versus GPU</h2><ul><li>A <b>CPU</b> has a handful of fast, flexible cores, built for sequential logic with many decisions: run a spreadsheet, parse a contract, serve a website.</li><li>A <b>GPU</b> has thousands of simple cores that all perform the same operation on different data at once. Born for rendering pixels, perfect for matrix multiplication, and Module 3 showed that Transformers are almost nothing but matrix multiplication.</li></ul><p>Two more facts complete the picture:</p><ul><li><b>FLOP</b> means one floating-point operation; compute budgets (Module 4&rsquo;s C ≈ 6ND) are measured in FLOPs.</li><li><b>Memory bandwidth</b> is often the real constraint: a GPU can only compute as fast as weights can be fed from memory to cores. This is why fewer bits per weight (quantization) speeds up serving even when raw compute is plentiful, and why the KV cache (Module 6) pressures memory, not arithmetic.</li></ul>'},
{t:'q', q:'Why did the GPU, a graphics chip, become the engine of the AI era?', opts:['It was the cheapest chip available','Neural networks reduce to huge matrix multiplications, the exact massively parallel workload GPUs were built for','GPUs store more data than hard drives','Marketing by chip vendors'], a:1, ex:'Same shape of work: do one simple operation on millions of values at once. Pixels yesterday, attention scores and MLP layers today.'},
{t:'q', q:'A serving engineer says a model is "memory-bandwidth bound". What does that mean?', opts:['The model forgot its training','The GPU&rsquo;s cores sit idle waiting for weights to stream in from memory, so feeding bytes faster (or shrinking them via quantization) helps more than adding compute','The context window is full','The datacenter is out of disk space'], a:1, ex:'Generation reads every weight for every token. When the pipe from memory is the bottleneck, halving bits per weight nearly halves serving time, which is why quantization is a speed story as much as a size story.'},
]},

{id:'c0c', title:'Probability, the engine of prediction', screens:[
{t:'txt', h:'<h2>Distributions, not answers</h2><p>A <b>probability distribution</b> assigns each possible outcome a number between 0 and 1, with all of them summing to exactly 1. That is the complete formal object behind everything an LLM outputs.</p><div class="ex"><b>Worked example.</b> Roll one die: each face has probability 1/6. Now weight the die so 6 comes up half the time: {6: 0.50, others: 0.10 each}. Still sums to 1. An LLM&rsquo;s output over its vocabulary is exactly this kind of weighted die with 100,000+ faces, re-weighted after every token.</div><p>A <b>conditional</b> probability is one that depends on known context: P(rain | dark clouds) differs from P(rain). Next-token prediction is precisely a conditional distribution: P(next token | everything so far). The pipe symbol | reads as &ldquo;given&rdquo;.</p>'},
{t:'w', widget:'prob', h:'<h2>Surprise, measured</h2><p>Information theory measures how surprising an outcome is: <b>surprise = &minus;log&#8322;(p)</b>, in bits. Slide the probability and watch. Certain events carry no information; rare ones carry a lot. Cross-entropy loss (Module 2) is exactly this surprise, averaged over training text.</p>'},
{t:'q', q:'An event has probability 1/8. Its surprise in bits is', opts:['1 bit','3 bits','8 bits','0.125 bits'], a:1, ex:'&minus;log&#8322;(1/8) = 3: it takes three halvings to get to 1/8. Notice the bridge: the loss a model minimizes is the average number of bits of surprise per token.'},
{t:'q', q:'Why is "the model predicts the next word" more precisely stated as "the model outputs a conditional probability distribution"?', opts:['Because marketing prefers longer phrases','Because the output is a full set of weighted options given the context, from which one token is then sampled, not a single predetermined answer','Because models cannot handle words','Because distributions are faster to compute'], a:1, ex:'All of Module 6&rsquo;s machinery (temperature, top-p) operates on that distribution. Understanding outputs as weighted options given context explains both creativity and hallucination in one frame.'},
]},

{id:'c0d', title:'Information, compression, and complexity', screens:[
{t:'txt', h:'<h2>Prediction and compression are the same thing</h2><p><b>Entropy</b> is the average surprise of a source: how many bits per symbol it fundamentally takes to encode it. English text has an entropy around 1 bit per character, far below the 8 bits a raw byte spends, because English is predictable.</p><div class="ex"><b>Worked example.</b> A fair coin: entropy 1 bit per flip, incompressible. A coin that lands heads 99% of the time: entropy 0.08 bits per flip; a smart code (&ldquo;count the runs of heads&rdquo;) compresses it enormously. The better you can predict, the better you can compress, and vice versa. They are mathematically the same skill.</div><div class="note"><b>The punchline for LLMs.</b> Training a model to predict text IS training it to compress text. A model with loss 2.0 literally defines a code using 2.0 bits per token (its <b>perplexity</b> is 2<sup>2.0</sup> &asymp; 4 equally-likely choices per step). The scaling laws of Module 4 chart the falling cost, in bits, of describing human text. E in the loss formula is text&rsquo;s own entropy: the floor no model can pass.</div>'},
{t:'txt', h:'<h2>Counting cost before running</h2><p><b>Complexity analysis</b> asks how work grows as input grows, written O(&middot;):</p><ul><li><b>O(n)</b>, linear: double the input, double the work. Reading a document.</li><li><b>O(n&sup2;)</b>, quadratic: double the input, quadruple the work. Comparing everything to everything.</li><li><b>O(2<sup>n</sup>)</b>, exponential: each added element doubles total work. Intractable fast.</li></ul><div class="ex"><b>You already used this.</b> Module 3: attention compares every token with every other token, so cost grows as n&sup2;. A 10&times; longer context costs about 100&times; the attention compute. That single line of analysis explains long-context pricing, the &ldquo;lost in the middle&rdquo; engineering fight, and years of research into cheaper attention.</div>'},
{t:'q', q:'A model has perplexity 4 on a text. The right reading is', opts:['it is wrong 4% of the time','at each step it is, on average, as uncertain as a fair choice among 4 options (2 bits of surprise per token)','it considers only 4 tokens','it needs 4 GPUs'], a:1, ex:'Perplexity = 2^(loss in bits). It converts an abstract loss into an intuitive &ldquo;effective number of choices&rdquo;, the standard way practitioners feel model quality.'},
{t:'q', q:'If attention is O(n&sup2;) in context length, growing a context from 10,000 to 100,000 tokens multiplies attention compute by about', opts:['10','30','100','1,000'], a:2, ex:'(100,000/10,000)&sup2; = 100. Quadratic growth is why long context is a real engineering and pricing challenge, not a dial vendors forgot to turn.'},
]},
],
test:[
{q:'Each additional bit', opts:['adds one more possible value','doubles the number of distinguishable values','halves memory use','adds 8 possible values'], a:1, ex:'n bits distinguish 2&#8319; values. The doubling instinct explains vocabulary sizes, hash spaces, and quantization levels alike.'},
{q:'A 4-bit quantized weight can take how many distinct levels?', opts:['4','8','16','256'], a:2, ex:'2&#8308; = 16 levels. Compressing each learned number into 16 buckets is why 4-bit models are small and fast, and why a little quality is shaved off.'},
{q:'Weights-only memory for a 8B model in 8-bit is about', opts:['1 GB','8 GB','16 GB','64 GB'], a:1, ex:'8-bit is 1 byte per parameter: 8 billion bytes = 8 GB. Parameters &times; bytes-per-parameter is the first arithmetic of any deployment plan.'},
{q:'GPUs beat CPUs at neural networks because', opts:['they have higher clock speeds','thousands of simple cores apply the same operation to masses of data at once, matching matrix multiplication&rsquo;s shape','they are newer','they use less power per chip'], a:1, ex:'Parallel uniform arithmetic is the exact workload. CPUs stay better at branching, sequential logic.'},
{q:'"Memory-bandwidth bound" generation improves most from', opts:['a faster internet connection','fewer bytes per weight (quantization) and better caching, since cores already outrun the memory feed','more CPU cores','longer prompts'], a:1, ex:'When streaming weights is the bottleneck, shrinking bytes moved per token is the lever. This links hardware reality to the serving economics of Module 6.'},
{q:'All probabilities in a distribution must', opts:['be equal','sum to exactly 1','be above 0.5','be whole numbers'], a:1, ex:'That constraint is what softmax (Module 1) exists to enforce over the vocabulary.'},
{q:'Cross-entropy loss, in information terms, is', opts:['the number of wrong answers','the average surprise, in bits (times a constant), the model experiences on the true next token','the count of parameters','the temperature'], a:1, ex:'Loss = average &minus;log P(truth). Lower loss = less surprised = better compression of language. One idea, three vocabularies.'},
{q:'Doubling context length under standard attention multiplies attention compute by about', opts:['2','4','8','no change'], a:1, ex:'O(n&sup2;): 2&times; length is 4&times; pairwise comparisons. Complexity analysis prices features before anyone writes code.'},
]});
/* ============ FOUNDATIONS 1. FROM TEXT TO NUMBERS ============ */
MODULES.push({
id:'f1', track:'F', title:'From Text to Numbers', tag:'Tokens, embeddings, and what a model really predicts', icon:'\u{1F524}', color:'#4f8ef7',
lessons:[

{id:'f1a', title:'What a language model does', screens:[
{t:'txt', h:'<h2>One job, done billions of times</h2><p>Strip away everything else and a large language model does exactly one thing. Given a sequence of text, it outputs a probability for every possible next piece of text in its vocabulary.</p><p>Feed it <code>The capital of France is</code> and it returns something like: <code>Paris</code> 92%, <code>a</code> 2%, <code>located</code> 1%, and tiny probabilities for tens of thousands of other candidates.</p><p>Everything an LLM appears to do, from writing memos to debugging code, emerges from repeating this single prediction, appending the chosen token, and predicting again.</p>'},
{t:'txt', h:'<h2>Why prediction forces understanding</h2><p>Predicting the next word well is deceptively hard. To finish <code>The verdict in the lawsuit against the landlord was</code> a model needs grammar, legal vocabulary, and a sense of how disputes resolve.</p><p>To finish a chess commentary it needs to track the board. To finish a balance sheet it needs accounting identities.</p><div class="note"><b>Key idea.</b> Training compresses the patterns of the world into the model, because the world&rsquo;s patterns are what make text predictable. Prediction is the training objective; capability is the side effect.</div>'},
{t:'q', q:'At its core, what does an LLM compute at each step?', opts:['The single correct next word, looked up in a database','A probability distribution over every token in its vocabulary','A grammatical parse tree of the input sentence','A search over web pages related to the prompt'], a:1, ex:'The model outputs a probability for every token in its vocabulary. Sampling from that distribution produces the next token, and the loop repeats.'},
{t:'txt', h:'<h2>Not a database, not a search engine</h2><p>An LLM stores no documents. Its knowledge lives in billions of numeric parameters shaped during training. That has two consequences you will meet again and again in practice.</p><ul><li><b>It can generalize.</b> It answers questions no document ever answered, by combining patterns.</li><li><b>It can confabulate.</b> When patterns point to a plausible but false continuation, it states it with the same confidence as a true one. This is hallucination, and we will study its mechanics in the Capabilities module.</li></ul><p>Keep this dual nature in mind. It is the source of both the value and the risk in every business application.</p>'},
{t:'q', q:'A colleague says an LLM "looked up" a court case that turns out not to exist. What actually happened?', opts:['The database entry was corrupted','The model retrieved an outdated web page','The model generated a plausible-sounding continuation from statistical patterns, with no lookup involved','A competitor poisoned the training data'], a:2, ex:'There is no lookup. The model generated text that fits the statistical shape of a real citation. Plausible and true are different properties, and the raw model only optimizes for the first.'},
]},

{id:'f1b', title:'Tokenization', screens:[
{t:'txt', h:'<h2>Models do not read words</h2><p>Before any text reaches the network, a <b>tokenizer</b> splits it into tokens, which are chunks drawn from a fixed vocabulary of roughly 50,000 to 200,000 entries. Common words like <code>the</code> are single tokens. Rare words get split: <code>underwriting</code> might become <code>under</code> + <code>writing</code>.</p><p>The standard algorithm is <b>byte-pair encoding (BPE)</b>. It starts from raw bytes and repeatedly merges the most frequent adjacent pair, so frequent strings earn their own token and anything, even typos and code, can still be represented.</p>'},
{t:'w', widget:'tokenizer', h:'<h2>Try it</h2><p>Type any sentence and watch it split into tokens. Notice that spaces attach to the following word, and that a rough rule of thumb is 1 token &asymp; 0.75 English words.</p>'},
{t:'q', q:'Why do tokenizers split rare words into subword pieces rather than keeping a token for every word?', opts:['It makes the text more readable for engineers','A fixed, modest vocabulary can then represent any string, including new words and typos, while keeping the output layer a manageable size','Subwords are required by GPU hardware','It encrypts the input for privacy'], a:1, ex:'With subword pieces (down to single bytes as a fallback) nothing is ever out of vocabulary, and the vocabulary stays small enough for the model to score every candidate at each step.'},
{t:'txt', h:'<h2>Why tokens matter commercially</h2><p>Every API prices in tokens, in and out. Context limits are in tokens. Latency scales with tokens. So tokenization quirks become line items.</p><ul><li>Numbers often split oddly: <code>2026</code> may be one token but <code>20260712</code> several. This is one reason arithmetic is unreliable.</li><li>Non-English text can cost 2 to 4 times more tokens for the same meaning, which changes the economics of multilingual products.</li><li>A 300-page data room is roughly 150,000 tokens, which is why long-context handling is a real product differentiator.</li></ul>'},
{t:'q', q:'A vendor quotes $15 per million output tokens. Your workflow generates about 2,000 words per report. Roughly what does generation cost per report?', opts:['About 4 cents','About 40 cents','About $4','About $15'], a:0, ex:'2,000 words is roughly 2,700 tokens (divide by 0.75). 2,700 / 1,000,000 &times; $15 &asymp; $0.04. Token arithmetic like this should be reflex before signing any AI contract.'},
]},

{id:'f1c', title:'Embeddings', screens:[
{t:'txt', h:'<h2>Meaning as geometry</h2><p>Each token ID is mapped to an <b>embedding</b>, a vector of typically 1,000 to 20,000 numbers. These vectors are learned, and training arranges them so that <i>similarity in meaning becomes closeness in space</i>.</p><p><code>hotel</code> and <code>resort</code> end up near each other. <code>hotel</code> and <code>turbine</code> end up far apart. Directions capture relations too: the displacement from <code>Paris</code> to <code>France</code> resembles the one from <code>Rome</code> to <code>Italy</code>.</p>'},
{t:'w', widget:'embed', h:'<h2>Measure similarity</h2><p>Pick two words and see their cosine similarity, the standard closeness score between vectors. 1.0 means identical direction, near 0 means unrelated.</p>'},
{t:'txt', h:'<h2>The formula behind the score</h2><p>Cosine similarity between vectors <b>a</b> and <b>b</b>:</p><div class="formula">cos(&theta;) = (a &middot; b) / (&#8214;a&#8214; &#8214;b&#8214;)</div><p>The dot product <span class="formula rm" style="display:inline;padding:2px 8px;font-size:15px">a &middot; b = &Sigma; a<sub>i</sub>b<sub>i</sub></span> measures alignment; dividing by the lengths removes magnitude so only direction, i.e. meaning, remains.</p><div class="ex"><b>Why you care.</b> Embeddings work for whole documents as well as single words. Search by meaning instead of keywords is the engine behind RAG (Modern Stack module), semantic deal screening, and every &ldquo;chat with your documents&rdquo; product you will evaluate.</div>'},
{t:'q', q:'Two documents have cosine similarity 0.93. What does that tell you?', opts:['They share at least 93% of their words','Their embedding vectors point in very similar directions, so their content is semantically close','One is a copy of the other','They were written by the same author'], a:1, ex:'Cosine similarity compares direction in embedding space, which tracks meaning. Two texts can share almost no vocabulary and still score high if they discuss the same thing.'},
{t:'q', q:'Why is embedding-based search better than keyword search for screening a data room?', opts:['It is always cheaper to run','It finds passages that match the meaning of a query even when the wording differs, e.g. "change of control" vs "ownership transfer provisions"','It never returns irrelevant results','It works without any preprocessing of the documents'], a:1, ex:'Embeddings match concepts, not strings. That is decisive in legal and financial documents where the same risk hides behind many phrasings. It still returns noise, so precision must be measured, not assumed.'},
]},

{id:'f1d', title:'From logits to probabilities', screens:[
{t:'txt', h:'<h2>The output end of the model</h2><p>After all its internal computation, the model produces one raw score per vocabulary token. These scores are called <b>logits</b>. They can be any real number and do not sum to anything meaningful yet.</p><p>The <b>softmax</b> function converts logits into a proper probability distribution:</p><div class="formula">P(token i) = e<sup>z<sub>i</sub></sup> / &Sigma;<sub>j</sub> e<sup>z<sub>j</sub></sup></div><p>Exponentiating makes everything positive and amplifies gaps; normalizing makes the values sum to 1.</p>'},
{t:'txt', h:'<h2>A worked example</h2><p>Suppose after <code>The hotel lobby was</code> the model gives logits: <code>elegant</code> 4.0, <code>crowded</code> 3.0, <code>empty</code> 2.0.</p><div class="ex"><b>Step 1.</b> Exponentiate: e<sup>4</sup> &asymp; 54.6, e<sup>3</sup> &asymp; 20.1, e<sup>2</sup> &asymp; 7.4.<br><b>Step 2.</b> Sum: 82.1.<br><b>Step 3.</b> Divide: 66%, 24%, 9%.</div><p>A gap of just 1.0 in logits produced almost a 3&times; gap in probability. Softmax is winner-take-most, and in the Inference module you will see how temperature reshapes exactly this.</p>'},
{t:'q', q:'Logits for three candidates are 5.0, 5.0, and 1.0. What does softmax produce?', opts:['Three equal probabilities near 33%','Two equal high probabilities near 49% each and one tiny probability','100% on the first candidate','Probabilities cannot be computed from ties'], a:1, ex:'e&#8309; = 148.4 for each of the first two, e&sup1; = 2.7. Each big one gets 148.4/299.5 &asymp; 49.5%, the small one about 1%. Equal logits mean equal probability.'},
{t:'q', q:'Why must the model&rsquo;s vocabulary be finite and fixed?', opts:['Copyright law limits vocabulary size','The output layer must assign a score to every candidate token at every step, so the candidate set must be enumerable','Users could not type new words otherwise','GPUs cannot store strings'], a:1, ex:'Softmax runs over the whole vocabulary at every generated token. A fixed token set (with byte-level fallback for anything unseen) is what makes that computation possible.'},
]},
],
test:[
{q:'Which statement best describes how an LLM produces a paragraph of text?', opts:['It retrieves the closest matching paragraph from its training data','It predicts one token at a time, each conditioned on everything so far, sampling from a probability distribution at each step','It plans the full paragraph internally, then prints it in one pass','It translates a logical form into English'], a:1, ex:'Generation is autoregressive: predict a distribution, pick a token, append, repeat.'},
{q:'Roughly how many tokens is a 10,000-word English document?', opts:['About 2,500','About 7,500','About 13,300','About 40,000'], a:2, ex:'At roughly 0.75 words per token, 10,000 words &asymp; 13,300 tokens. Divide words by 0.75.'},
{q:'BPE tokenization builds its vocabulary by', opts:['listing every word in a dictionary','repeatedly merging the most frequent adjacent symbol pairs found in training text','asking linguists to define morphemes','hashing words into fixed buckets'], a:1, ex:'BPE is purely statistical: frequent character sequences earn dedicated tokens; everything else decomposes into pieces.'},
{q:'The core reason LLMs acquire broad capabilities from next-token prediction is that', opts:['the objective secretly includes reasoning tests','predicting text well requires internalizing the patterns, facts, and structures that generated the text','engineers hand-code skills after training','the vocabulary contains skill tokens'], a:1, ex:'Text is a projection of the world. Compressing its regularities into parameters yields knowledge and skill as by-products.'},
{q:'An embedding is', opts:['a compressed zip of the training data','a learned vector of numbers positioning a token (or text) in a space where distance tracks meaning','an encrypted user identifier','a list of synonyms'], a:1, ex:'Embeddings turn discrete symbols into geometry so that similarity becomes measurable.'},
{q:'Cosine similarity uses the dot product divided by vector lengths in order to', opts:['speed up the computation','compare direction only, ignoring magnitude','guarantee a positive result','handle different vocabulary sizes'], a:1, ex:'Normalizing by length leaves only the angle between vectors, which is what tracks semantic similarity.'},
{q:'Softmax turns logits of 3.0 and 1.0 (two candidates only) into approximately', opts:['75% / 25%','88% / 12%','60% / 40%','95% / 5%'], a:1, ex:'e&sup3;&asymp;20.1, e&sup1;&asymp;2.7; 20.1/22.8 &asymp; 88%. Exponentiation widens raw gaps.'},
{q:'Your legal team asks whether the model could ever output a word that was not in its training data vocabulary. The correct answer is', opts:['No, output is limited to composing tokens from its fixed vocabulary, though byte-level tokens let it spell out any string','Yes, it invents new tokens during inference','Only if temperature exceeds 1','Only in fine-tuned models'], a:0, ex:'The token set is fixed at training time. Byte-fallback tokens mean any character sequence can still be assembled from pieces.'},
]});

/* ============ FOUNDATIONS 2. NEURAL NETWORK FUNDAMENTALS ============ */
MODULES.push({
id:'f2', track:'F', title:'Neural Network Fundamentals', tag:'Weights, loss, gradients, and how machines learn', icon:'\u{1F9E0}', color:'#7c5cfc',
lessons:[

{id:'f2a', title:'Neurons, weights, and layers', screens:[
{t:'txt', h:'<h2>The atom of the network</h2><p>A single artificial neuron computes a weighted sum of its inputs, adds a bias, and passes the result through a simple nonlinear function:</p><div class="formula">y = f(w&#8321;x&#8321; + w&#8322;x&#8322; + &hellip; + w&#8345;x&#8345; + b)</div><p>The weights <i>w</i> and bias <i>b</i> are the <b>parameters</b>. When you hear that a model has 70 billion parameters, it means 70 billion of these adjustable numbers.</p><p>The nonlinearity <i>f</i> matters: without it, stacking layers would collapse into one big linear function, and linear functions cannot represent language.</p>'},
{t:'txt', h:'<h2>Layers upon layers</h2><p>Neurons are organized in layers. Each layer transforms its input vector into a new vector, and depth lets the network build abstractions: early layers detect surface patterns, later layers compose them into concepts.</p><div class="ex"><b>Concrete scale.</b> In a large Transformer, one hidden vector might have 8,000+ dimensions and a single layer&rsquo;s main matrix multiply involves tens of millions of parameters. Stack 80 to 120 such layers and you reach modern model sizes.</div><div class="note"><b>Key idea.</b> The network is just matrix multiplication plus simple nonlinearities, repeated. There is no hidden symbolic machinery. All the intelligence is in <i>which numbers</i> the weights hold.</div>'},
{t:'q', q:'Why is a nonlinear activation function between layers essential?', opts:['It makes training faster','Without it, any stack of layers is mathematically equivalent to a single linear layer, which is far too weak for language','It reduces memory usage','It prevents overfitting entirely'], a:1, ex:'Composition of linear maps is linear. The nonlinearity is what lets depth create new representational power.'},
{t:'q', q:'"This model has 8 billion parameters" means', opts:['it was trained on 8 billion documents','it contains 8 billion learned numbers (weights and biases) that define its behavior','it can output 8 billion different tokens','it needs 8 billion GPUs'], a:1, ex:'Parameters are the learned numbers inside the network. Data size, vocabulary, and hardware are separate quantities, and confusing them is a common diligence red flag.'},
]},

{id:'f2b', title:'Loss and cross-entropy', screens:[
{t:'txt', h:'<h2>Scoring how wrong we are</h2><p>Training needs a single number that says how bad the model&rsquo;s current predictions are. That number is the <b>loss</b>. For language models the loss is <b>cross-entropy</b>: the negative log probability the model assigned to the token that actually came next.</p><div class="formula">L = &minus;log P(correct token)</div><p>If the model gave the true next token probability 0.9, loss is 0.105. If it gave 0.01, loss is 4.6. Confidently wrong predictions are punished hard; the loss is averaged over enormous amounts of text.</p>'},
{t:'txt', h:'<h2>Feel the numbers</h2><div class="ex"><b>P(correct) = 1.0</b> &rarr; loss 0 (perfect)<br><b>P(correct) = 0.5</b> &rarr; loss 0.69<br><b>P(correct) = 0.1</b> &rarr; loss 2.30<br><b>P(correct) = 0.001</b> &rarr; loss 6.9</div><p>Frontier models reach average losses well under 2 on general web text (numbers depend on tokenizer and datasets, so compare like with like). Because the scale is logarithmic, a drop from 2.1 to 2.0 is a real capability jump, not a rounding error.</p><div class="note"><b>Investor lens.</b> Scaling laws (Training module) are stated in exactly this currency: loss as a function of model size, data, and compute. When labs claim progress, this is the metric underneath.</div>'},
{t:'q', q:'The model assigned probability 0.25 to the token that actually occurred. Its cross-entropy loss on that step is closest to', opts:['0.25','0.75','1.39','4.0'], a:2, ex:'&minus;ln(0.25) = ln(4) &asymp; 1.386. Lower probability on the truth means higher loss, logarithmically.'},
{t:'q', q:'Why use &minus;log P rather than just "1 if wrong, 0 if right" as the loss?', opts:['It is easier to explain to regulators','Log loss is smooth and differentiable and rewards well-calibrated confidence, which gradient-based training requires','It uses less memory','Accuracy cannot be computed for text'], a:1, ex:'Gradients need a smooth surface. Log loss also distinguishes "barely right" from "confidently right", which drives calibration.'},
]},

{id:'f2c', title:'Gradient descent', screens:[
{t:'txt', h:'<h2>Rolling downhill</h2><p>Imagine the loss as a surface over all possible weight settings, billions of dimensions instead of two. Training means finding low ground. The <b>gradient</b> is the direction of steepest increase, so we step the opposite way:</p><div class="formula">w &larr; w &minus; &eta; &middot; &part;L/&part;w</div><p>&eta; (eta) is the <b>learning rate</b>, the step size. Too small and training crawls; too large and you overshoot the valley and diverge. Modern optimizers like AdamW adapt step sizes per parameter, but the core logic is exactly this rule.</p>'},
{t:'w', widget:'gd', h:'<h2>Steer the descent</h2><p>This ball sits on a loss curve. Adjust the learning rate and step. Watch small rates converge slowly and large ones bounce or explode.</p>'},
{t:'q', q:'With a much too large learning rate, training typically', opts:['finds the minimum faster with no downside','overshoots the minimum, with loss oscillating or exploding','stops moving at all','uses more memory'], a:1, ex:'Steps longer than the valley is wide carry you past the bottom, often to a point with a steeper slope, and the process can diverge. You saw this in the widget.'},
{t:'q', q:'Training uses "stochastic" gradient descent, computing gradients on random mini-batches of data rather than the whole dataset because', opts:['random batches provide a good, cheap estimate of the true gradient, making each step affordable at internet scale','whole-dataset gradients are illegal','mini-batches improve the final vocabulary','randomness is needed for creativity in outputs'], a:0, ex:'A batch of a few million tokens estimates the full gradient well enough. Trillions of tokens per step would be absurdly expensive for near-zero extra signal.'},
]},

{id:'f2d', title:'Backpropagation', screens:[
{t:'txt', h:'<h2>Assigning blame through depth</h2><p>Gradient descent needs &part;L/&part;w for every one of billions of weights, many layers away from the output. <b>Backpropagation</b> computes all of them in one backward sweep using the chain rule:</p><div class="formula">&part;L/&part;w = &part;L/&part;y &middot; &part;y/&part;h &middot; &part;h/&part;w</div><p>Run the network forward and cache intermediate values, then walk backward multiplying local derivatives. Cost is roughly twice the forward pass, which is what makes training deep networks feasible at all.</p>'},
{t:'txt', h:'<h2>The full training step</h2><ol><li><b>Forward.</b> Push a batch of text through; get predicted distributions.</li><li><b>Loss.</b> Cross-entropy against the actual next tokens.</li><li><b>Backward.</b> Backpropagate to get every gradient.</li><li><b>Update.</b> Nudge all weights against their gradients.</li></ol><p>Repeat millions of times. Nothing else is happening inside a $100M training run: this loop, at monstrous scale.</p><div class="note"><b>Key idea.</b> Nobody programs knowledge in. Grammar, facts, and reasoning patterns all condense out of this blind numerical process, which is also why nobody can fully predict or inspect what a model has learned.</div>'},
{t:'q', q:'Backpropagation is best described as', opts:['a second neural network that critiques the first','an efficient application of the chain rule that computes the gradient of the loss with respect to every weight in one backward pass','a way to compress the model after training','random perturbation of weights until loss improves'], a:1, ex:'It is calculus, organized cleverly. One forward pass plus one backward pass yields all billions of gradients.'},
{t:'q', q:'Which claim in a startup&rsquo;s deck should raise a red flag given what you now know?', opts:['"We fine-tune open models on proprietary data"','"Our engineers manually encode domain rules directly into the model&rsquo;s weights"','"We use AdamW with a cosine learning-rate schedule"','"Our loss curves are in the appendix"'], a:1, ex:'Weights are set by gradient descent, not by hand. You cannot manually write rules into billions of learned parameters. The other statements are ordinary practice.'},
]},
],
test:[
{q:'A single artificial neuron computes', opts:['a database query over inputs','a weighted sum of inputs plus bias, passed through a nonlinearity','the average of its inputs','a comparison against stored examples'], a:1, ex:'y = f(w&middot;x + b). Everything else in deep learning is arrangements of this.'},
{q:'Depth (many layers) matters because', opts:['it reduces parameter count','successive layers compose simple features into progressively more abstract representations','shallow networks cannot run on GPUs','regulators require it'], a:1, ex:'Hierarchical composition is the point: patterns of patterns of patterns.'},
{q:'Cross-entropy loss on a step where the model gave the true token probability 0.5 is about', opts:['0.5','0.69','1.0','2.0'], a:1, ex:'&minus;ln(0.5) = ln 2 &asymp; 0.693.'},
{q:'The learning rate controls', opts:['how many tokens the model reads','the size of each weight update step along the negative gradient','the vocabulary size','the sampling temperature'], a:1, ex:'It scales the update w &larr; w &minus; &eta;&nabla;L. Getting its schedule right is a core part of training craft.'},
{q:'Loss falling from 2.1 to 2.0 on the same evaluation data indicates', opts:['a trivial 5% improvement in accuracy','a meaningful capability gain, because loss is logarithmic in assigned probability','the model memorized the test set','nothing; loss is arbitrary'], a:1, ex:'Small loss deltas at the frontier correspond to large, broad improvements. This is why labs fight for every 0.01.'},
{q:'Backpropagation requires the forward pass to cache intermediate activations because', opts:['they are sold as telemetry','local derivatives along the chain rule path are evaluated at those cached values during the backward pass','GPUs cannot recompute anything','the loss is stored inside them'], a:1, ex:'The chain rule multiplies local derivatives, each evaluated at the values the forward pass actually produced. (Trading memory for recompute, "activation checkpointing", is a standard variant.)'},
{q:'Which is the correct ordering of one training step?', opts:['update &rarr; forward &rarr; loss &rarr; backward','forward &rarr; loss &rarr; backward &rarr; update','loss &rarr; forward &rarr; update &rarr; backward','backward &rarr; forward &rarr; update &rarr; loss'], a:1, ex:'Predict, score, differentiate, adjust. Millions of repetitions of this loop is what "training" means.'},
{q:'Why can no one simply inspect a trained model and read off what it knows?', opts:['Licenses forbid it','Knowledge is distributed across billions of numerically optimized weights with no human-readable structure','The weights are encrypted','It changes its weights during every conversation'], a:1, ex:'Interpretability is an open research field precisely because gradient descent produces competence without legibility. (And note: weights are frozen at inference; conversations do not change them.)'},
]});
/* ============ FOUNDATIONS 3. ATTENTION AND THE TRANSFORMER ============ */
MODULES.push({
id:'f3', track:'F', title:'Attention and the Transformer', tag:'The architecture behind every modern LLM', icon:'\u{1F50D}', color:'#f0566b',
lessons:[

{id:'f3a', title:'Why context needs attention', screens:[
{t:'txt', h:'<h2>The problem</h2><p>In <code>The tenant sued the landlord because he withheld the deposit</code>, what does <code>he</code> refer to? Resolving it requires connecting words that sit far apart, and which connection matters depends entirely on content.</p><p>Older architectures (RNNs) read text strictly left to right, squeezing everything seen so far into one fixed-size summary. Long-range information degraded, and processing was sequential, so it could not exploit massive parallel hardware.</p>'},
{t:'txt', h:'<h2>The 2017 answer</h2><p>The Transformer, introduced in the paper <i>Attention Is All You Need</i>, replaced sequential reading with <b>attention</b>: every position can look directly at every other position and decide, with learned weights, how much each one matters.</p><ul><li><b>Direct access.</b> Token 4,000 can attend to token 3 with no degradation from distance.</li><li><b>Content-based.</b> What to look at is computed from meaning, not fixed by position.</li><li><b>Parallel.</b> All positions process simultaneously, a perfect match for GPUs.</li></ul><div class="note"><b>Key idea.</b> That third property is arguably why the last decade happened: an architecture that could soak up arbitrary amounts of parallel compute turned scaling laws into a plan you could spend against.</div>'},
{t:'q', q:'The decisive hardware-related advantage of attention over recurrent models is', opts:['it uses less electricity','all sequence positions can be processed in parallel, matching what GPUs are good at, so training scales','it stores text in the GPU cache','it needs no matrix multiplication'], a:1, ex:'RNNs are inherently sequential; step t waits for t&minus;1. Attention computes all pairwise interactions at once, letting compute, and therefore capability, scale with hardware.'},
{t:'q', q:'In the sentence about the tenant and landlord, resolving "he" is a good illustration of', opts:['tokenization','a content-dependent long-range dependency, exactly what attention learns to route','softmax normalization','overfitting'], a:1, ex:'Which earlier word "he" binds to depends on meaning ("withheld the deposit" points to the landlord). Attention learns to route such connections.'},
]},

{id:'f3b', title:'Queries, keys, and values', screens:[
{t:'txt', h:'<h2>A soft lookup</h2><p>Attention works like a differentiable database query. From each token&rsquo;s vector, the model computes three projections with learned matrices:</p><ul><li><b>Query (Q)</b>, what this token is looking for.</li><li><b>Key (K)</b>, what this token offers to others.</li><li><b>Value (V)</b>, the information this token hands over if selected.</li></ul><p>Token A attends to token B strongly when A&rsquo;s query aligns with B&rsquo;s key (their dot product is large). The output for A is the weighted average of all values.</p>'},
{t:'txt', h:'<h2>The equation</h2><div class="formula">Attention(Q,K,V) = softmax( QK&#7488; / &radic;d<sub>k</sub> ) V</div><ol><li><b>QK&#7488;</b> gives every query-key dot product, a table of raw relevance scores between all pairs.</li><li><b>&radic;d<sub>k</sub></b> rescales so scores do not blow up as vector width grows, keeping softmax gradients healthy.</li><li><b>softmax</b> turns each row into weights summing to 1.</li><li><b>&times; V</b> blends value vectors by those weights.</li></ol><p>In a decoder LLM a <b>causal mask</b> blanks out all future positions, so predictions can only use the past.</p><div class="ex"><b>Worked micro-example.</b> Query of "he" dots with keys of "tenant" (score 2.1) and "landlord" (score 4.3). Softmax over {2.1, 4.3} gives &asymp; 10% / 90%. The output vector for "he" becomes 0.1 &times; V(tenant) + 0.9 &times; V(landlord): the model has, numerically, resolved the pronoun.</div>'},
{t:'q', q:'In the QKV scheme, a large dot product between token A&rsquo;s query and token B&rsquo;s key means', opts:['A and B are the same word','B&rsquo;s value vector will contribute heavily to A&rsquo;s updated representation','B is deleted from context','A is earlier in the sentence than B'], a:1, ex:'Query&middot;key alignment sets the attention weight; the weight scales how much of B&rsquo;s value flows into A.'},
{t:'q', q:'The causal mask in a decoder LLM exists because', opts:['future tokens do not exist yet at generation time, so training must also hide them to match','it saves electricity','users must not see the system prompt','softmax fails on long rows'], a:0, ex:'The model is trained to predict token t from tokens 1&hellip;t&minus;1 only. Letting it peek ahead in training would teach a skill unusable at inference.'},
]},

{id:'f3c', title:'Multi-head attention', screens:[
{t:'txt', h:'<h2>Many relationships at once</h2><p>One attention pattern can track one kind of relationship. Language has many: syntax, coreference, topic, position. So each layer runs many attention <b>heads</b> in parallel (e.g. 32 to 128), each with its own learned Q, K, V projections, each free to specialize.</p><p>Interpretability work has found heads that track subject-verb agreement, heads that copy repeated names, "induction heads" that complete patterns seen earlier in the context. Their outputs are concatenated and mixed by another learned matrix.</p>'},
{t:'w', widget:'attn', h:'<h2>Read a real attention pattern</h2><p>Below is an attention map for one head reading a sentence. Rows are the token doing the looking; columns are what it looks at. Darker means more weight. Tap any cell. Notice "he" looking hard at "landlord", and the causal triangle: no cell above the diagonal.</p>'},
{t:'q', q:'Why multiple heads per layer instead of one big one?', opts:['Marketing named it that way','Separate heads can each specialize in a different relationship type (syntax, coreference, copying), then combine','One head would not fit in memory','Heads vote on the correct answer'], a:1, ex:'Each head has its own projections and learns its own routing pattern. Diversity of learned functions per layer is the point.'},
{t:'q', q:'In the heatmap you explored, cells above the diagonal were empty because', opts:['those scores were merely small','the causal mask forbids attending to future positions','the sentence was too short','rendering cut them off'], a:1, ex:'A decoder LLM never sees the future; masked scores are set to &minus;&infin; before softmax, making their weights exactly zero.'},
]},

{id:'f3d', title:'The full Transformer block', screens:[
{t:'txt', h:'<h2>One block, then stack</h2><p>A Transformer layer contains two sublayers:</p><ol><li><b>Multi-head attention</b>, which moves information <i>between</i> positions.</li><li><b>MLP (feed-forward network)</b>, applied to each position separately, which transforms information <i>within</i> a position. Roughly two thirds of parameters live here, and much of the model&rsquo;s factual knowledge with them.</li></ol><p>Around each sublayer: a <b>residual connection</b> (add the input back to the output) and <b>normalization</b>. Residuals mean each layer learns an incremental edit to a shared running representation, which is what makes 100-layer stacks trainable.</p>'},
{t:'txt', h:'<h2>End to end</h2><p>The whole model, assembled:</p><ol><li>Tokenize text; look up embeddings; add position information.</li><li>Pass through N identical blocks (attention + MLP), e.g. N = 32 for a 7B model, 100+ for frontier models.</li><li>Project the final vector at the last position onto the vocabulary; softmax; you have next-token probabilities.</li></ol><div class="note"><b>Perspective.</b> You now know the actual architecture of the systems reshaping your industries. Everything remaining, training, alignment, inference, agents, is about what gets poured into this structure and how it is served.</div>'},
{t:'q', q:'The MLP sublayers matter to a diligence discussion because', opts:['they are where most parameters, and much stored knowledge, reside, so "our moat is a bigger context window" and "our moat is model knowledge" are different claims','they are the only trainable part','they run on CPUs','they compress the vocabulary'], a:0, ex:'Attention routes; MLPs store and transform. Knowing where capability physically lives helps you interrogate claims about what a custom model does and does not contain.'},
{t:'q', q:'Residual connections primarily', opts:['double the parameter count','let each layer learn a small refinement to a running representation, keeping very deep stacks trainable','store the KV cache','prevent hallucination'], a:1, ex:'Gradients flow through the identity path, and layers only need to learn deltas. Without residuals, 100-layer training collapses.'},
]},
],
test:[
{q:'"Attention" in a Transformer means', opts:['the model focuses its camera on text','each position computes learned weights over other positions and blends their information accordingly','the model highlights keywords for users','a scheduling algorithm for GPUs'], a:1, ex:'It is a soft, learned, content-based routing of information between positions.'},
{q:'Q, K, and V vectors are produced by', opts:['the tokenizer','three learned projection matrices applied to each token&rsquo;s current representation','user configuration','the operating system'], a:1, ex:'Each is a linear projection of the token vector; the matrices are learned in training, per head.'},
{q:'Dividing QK&#7488; scores by &radic;d<sub>k</sub> exists to', opts:['keep dot products in a range where softmax stays well-behaved as vector width grows','make the math run on smaller chips','normalize the vocabulary','implement the causal mask'], a:0, ex:'Dot products of wide random-ish vectors grow with width; unscaled, softmax saturates and gradients vanish.'},
{q:'Attention cost grows with sequence length n roughly as', opts:['constant','linear, n','quadratic, n&sup2;','exponential, 2&#8319;'], a:2, ex:'Every position scores every other: n &times; n interactions. This is the root cause of long-context cost, and why sparse and linear attention variants are an active research area.'},
{q:'An "induction head" is', opts:['a marketing term','an attention head that finds earlier occurrences of the current pattern and copies what followed, a basic mechanism of in-context learning','the first layer of the model','a safety filter'], a:1, ex:'Induction heads complete [A][B] &hellip; [A] &rarr; [B]. They are among the best-understood circuits and help explain few-shot learning from examples in the prompt.'},
{q:'Information moves between different token positions', opts:['in the MLP sublayers','in the attention sublayers only','during tokenization','in the softmax'], a:1, ex:'MLPs act on each position independently. Attention is the only place where positions exchange information.'},
{q:'A 7B and a 70B model built on the same architecture differ mainly in', opts:['the alphabet they use','width and depth: bigger matrices and more layers','one has attention, the other does not','the 70B stores documents'], a:1, ex:'Same blueprint, scaled up. That sameness is what makes scaling laws (next module) so predictive.'},
{q:'Which pipeline order is correct for one prediction?', opts:['embeddings &rarr; attention/MLP blocks &rarr; vocabulary projection &rarr; softmax','softmax &rarr; attention &rarr; embeddings &rarr; output','tokenize &rarr; softmax &rarr; attention &rarr; embeddings','attention &rarr; tokenize &rarr; MLP &rarr; embeddings'], a:0, ex:'Text becomes vectors, vectors are refined through the stack, the final vector is scored against the vocabulary.'},
]});

/* ============ FOUNDATIONS 4. TRAINING AT SCALE ============ */
MODULES.push({
id:'f4', track:'F', title:'Training at Scale', tag:'Data, compute, scaling laws, and the economics of pretraining', icon:'\u{1F3ED}', color:'#f5a623',
lessons:[

{id:'f4a', title:'Pretraining data', screens:[
{t:'txt', h:'<h2>What models read</h2><p>Pretraining corpora are measured in <b>trillions of tokens</b>: filtered web crawl (Common Crawl derivatives), code repositories, books, papers, reference works, licensed archives. Frontier models see roughly 10 to 30+ trillion tokens, on the order of 100 million books&rsquo; worth of text.</p><p>The pipeline matters as much as the volume: deduplication, quality filtering, toxicity screens, language balancing, and increasingly <b>synthetic data</b> generated by other models to target gaps like math and code.</p>'},
{t:'txt', h:'<h2>Data as a strategic asset</h2><ul><li><b>Quality beats raw quantity.</b> A curated smaller corpus routinely outperforms a larger noisy one at equal compute.</li><li><b>The open web is largely harvested.</b> Marginal gains now come from curation, licensing, and synthetic generation, which is why labs sign content deals and why copyright litigation matters to the sector.</li><li><b>Contamination.</b> If benchmark test sets leak into training data, scores inflate. Ask "was the eval data excluded?" whenever a vendor quotes benchmarks.</li></ul>'},
{t:'q', q:'A startup claims superiority because it trained on "3&times; more data" than a rival. Your sharpest follow-up is', opts:['how many GPUs do you own','what did quality filtering and deduplication look like, and was evaluation data excluded from training','which cloud provider hosts you','how many employees have PhDs'], a:1, ex:'Volume alone predicts little. Curation quality and benchmark contamination determine whether "more data" means better or merely bigger, or fraudulently benchmarked.'},
{t:'q', q:'Why has synthetic training data become important?', opts:['It is legally risk-free','High-quality human text is close to exhausted in key domains, and targeted model-generated data can fill gaps such as math, code, and reasoning','It is required by regulators','It compresses better on disk'], a:1, ex:'The industry hit diminishing returns on scraping. Carefully generated and verified synthetic data (e.g. checked math solutions) extends the curve, with careful quality control to avoid degradation.'},
]},

{id:'f4b', title:'The training run', screens:[
{t:'txt', h:'<h2>The arithmetic of a run</h2><p>A useful approximation for total pretraining compute:</p><div class="formula">C &asymp; 6 &middot; N &middot; D</div><p><span class="rm">FLOPs &asymp; 6 &times; parameters &times; training tokens. The 6 covers the forward pass (&asymp;2ND) plus the backward pass (&asymp;4ND).</span></p><div class="ex"><b>Example.</b> 70B parameters &times; 15T tokens &times; 6 &asymp; 6.3 &times; 10&sup2;&#8308; FLOPs. On hardware delivering an effective 400 TFLOP/s per GPU, that is &asymp; 500,000 GPU-days: about 6 months on 2,700 GPUs, before counting failures and restarts.</div>'},
{t:'txt', h:'<h2>Why it is an industrial project</h2><ul><li><b>Clusters.</b> Tens of thousands of GPUs must exchange gradients every step; networking, not chips alone, bounds throughput.</li><li><b>Parallelism.</b> The model is sliced across devices three ways at once: by data batch, by layer, and within layers (tensor parallelism).</li><li><b>Failures.</b> At cluster scale, hardware dies mid-run routinely; checkpointing and restart engineering are core competencies.</li><li><b>One shot.</b> A frontier pretraining run costs $50M to $500M+ in compute. Mistakes in data mix or hyperparameters are discovered late and are brutally expensive, which is why smaller pilot runs and scaling laws guide the big one.</li></ul>'},
{t:'q', q:'Using C &asymp; 6ND, training a 10B-parameter model on 2T tokens needs about', opts:['1.2 &times; 10&sup2;&sup3; FLOPs','1.2 &times; 10&sup2;&sup2; FLOPs','2 &times; 10&sup1;&sup3; FLOPs','6 &times; 10&sup1;&#8313; FLOPs'], a:0, ex:'6 &times; (10&sup1;&#8304;) &times; (2 &times; 10&sup1;&sup2;) = 1.2 &times; 10&sup2;&sup3;. Being able to sanity-check compute claims on a napkin is a real diligence skill.'},
{t:'q', q:'The biggest reason frontier training is hard to replicate is', opts:['the algorithms are secret and patented','the combination of capital for compute, curated data at scale, and rare systems engineering talent to keep giant clusters productive','GPUs are export-restricted everywhere','the code is too long to read'], a:1, ex:'Core algorithms are largely public. The moat is industrial: capital, data pipelines, cluster reliability craft, and accumulated run experience.'},
]},

{id:'f4c', title:'Scaling laws', screens:[
{t:'txt', h:'<h2>The most consequential graph in AI</h2><p>Across many orders of magnitude, loss falls as a smooth <b>power law</b> in model size, data, and compute:</p><div class="formula">L(N, D) &asymp; E + A/N<sup>&alpha;</sup> + B/D<sup>&beta;</sup></div><p><span class="rm">E is irreducible entropy of language; the other terms shrink as parameters N and data D grow (&alpha;, &beta; &asymp; 0.3).</span></p><p>The <b>Chinchilla</b> result (2022): for a fixed compute budget, loss is minimized by scaling N and D together, roughly <b>20 tokens per parameter</b>. Many earlier models were oversized and undertrained.</p><p>In practice, deployed models are often trained far <i>past</i> compute-optimal on purpose: extra training data makes a <i>smaller</i> model better, and smaller means cheaper at inference forever after.</p>'},
{t:'w', widget:'scale', h:'<h2>Play lab director</h2><p>Set parameters and training tokens. The widget estimates loss from a Chinchilla-style law, total FLOPs, and a rough training cost. Try holding compute fixed while trading size against data.</p>'},
{t:'q', q:'Chinchilla&rsquo;s core finding was that', opts:['bigger models are always better','at fixed compute, model size and training tokens should grow together (&asymp;20 tokens per parameter), and many models had been undertrained for their size','data quality does not matter','loss cannot go below 2.0'], a:1, ex:'Compute-optimal training balances N and D. GPT-3 (175B on 300B tokens, under 2 tokens per parameter) was the canonical example of an oversized, undertrained model.'},
{t:'q', q:'Why would a lab deliberately train a small model far beyond its compute-optimal token count?', opts:['To waste rivals&rsquo; time','Because inference cost dominates over a deployed model&rsquo;s life: overtraining a small model buys cheap serving at slightly higher training cost','Because big models are illegal','To reduce the vocabulary'], a:1, ex:'Training happens once; serving runs forever. An 8B model trained on 15T tokens can match a much larger undertrained model while costing a fraction to serve. This is the economics behind the industry&rsquo;s efficient-model wave.'},
]},

{id:'f4d', title:'The economics of the frontier', screens:[
{t:'txt', h:'<h2>Where the money goes</h2><p>The cost stack of a frontier lab: chips and datacenter capacity (the dominant line), energy, data licensing and curation, elite research talent, and the many experimental runs that never ship. Reported single-run compute costs of $100M+ understate total program cost several-fold.</p><p>Capability follows compute along the scaling curve, so the frontier is, to first order, a <b>capital game</b>. This explains the structure of the industry: a handful of labs, backed by hyperscalers, in a spending race measured in tens of billions per year.</p>'},
{t:'txt', h:'<h2>Implications you can invest by</h2><ul><li><b>Depreciation.</b> Any given model&rsquo;s edge erodes in months as rivals catch up; moats must come from distribution, data flywheels, or switching costs, not from a frozen artifact.</li><li><b>Efficiency countertrend.</b> Algorithmic progress keeps cutting the cost of <i>yesterday&rsquo;s</i> capability: what cost $100/M tokens in 2023 costs a few dollars or less now. Applications get steadily cheaper to run.</li><li><b>Open weights.</b> Freely downloadable models near the frontier cap pricing power and enable on-premise deployment where data cannot leave, e.g. much of finance.</li></ul><div class="note"><b>Investor lens.</b> "The model" is rarely the durable asset. Ask instead who owns the customer, the proprietary data loop, and the workflow.</div>'},
{t:'q', q:'A fund is offered a stake in a startup whose pitch is "we trained our own 7B model, that is our moat". The strongest objection is', opts:['7B models cannot produce text','open-weight models of similar quality are freely available and improving, so a static small model is a depreciating asset, not a moat','training small models is illegal without a license','the model should have been 8B'], a:1, ex:'Unless the model embodies a defensible data loop or sits inside a sticky workflow, near-frontier open weights erode its value within quarters.'},
{t:'q', q:'Inference costs for a fixed capability level have historically', opts:['stayed flat','risen with inflation','fallen rapidly, often 10&times; or more within a year or two, through better models, distillation, quantization, and serving improvements','fallen only for images, not text'], a:2, ex:'Plan unit economics on a falling cost curve: workloads uneconomic today may clear easily next year. Timing, not feasibility, is often the real question.'},
]},
],
test:[
{q:'Frontier pretraining datasets are on the order of', opts:['millions of tokens','billions of tokens','tens of trillions of tokens','quadrillions of tokens'], a:2, ex:'Roughly 10 to 30+ trillion tokens for recent frontier models.'},
